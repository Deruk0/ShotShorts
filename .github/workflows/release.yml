name: Release

# Push a version tag (e.g. `git tag v2.1.0 && git push origin v2.1.0`)
# to build the portable .exe on CI and publish it as a GitHub Release
# named after the program version.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build portable exe and publish release
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve version and verify it matches package.json
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          APP_VERSION=$(node -p "require('./app/package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ] || [ "$VERSION" != "$APP_VERSION" ]; then
            echo "Tag $TAG does not match package versions (root: $PKG_VERSION, app: $APP_VERSION)." >&2
            echo "Bump both package.json files before tagging." >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # app/resources/ffmpeg.exe and ffprobe.exe are git-ignored, so CI
      # downloads a fresh FFmpeg to bundle a self-sufficient portable exe.
      - name: Download FFmpeg for bundling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' `
            -OutFile $zip -MaximumRedirection 5
          $dest = "$env:RUNNER_TEMP\ffmpeg"
          Expand-Archive -Path $zip -DestinationPath $dest
          $bin = Get-ChildItem -Path $dest -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          $probe = Get-ChildItem -Path $dest -Recurse -Filter 'ffprobe.exe' | Select-Object -First 1
          if (-not $bin -or -not $probe) {
            throw 'ffmpeg.exe or ffprobe.exe not found in the downloaded archive'
          }
          New-Item -ItemType Directory -Force -Path app/resources | Out-Null
          Copy-Item $bin.FullName 'app/resources/ffmpeg.exe' -Force
          Copy-Item $probe.FullName 'app/resources/ffprobe.exe' -Force
          Get-ChildItem app/resources | Select-Object Name, Length

      - name: Build portable .exe
        run: npm run app:build

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: node scripts/extract-release-notes.js "$VERSION" > release-notes.md

      - name: Create GitHub Release with the versioned exe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exe="Ready_App_EXE/ShotShorts ${VERSION}.exe"
          if [ ! -f "$exe" ]; then
            echo "Portable exe not found at: $exe" >&2
            ls -la Ready_App_EXE >&2 || true
            exit 1
          fi
          gh release create "$TAG" "$exe" \
            --title "ShotShorts v${VERSION}" \
            --notes-file release-notes.md
